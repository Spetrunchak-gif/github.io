<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Bank UI</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background: linear-gradient(135deg,#0f172a,#111827);
    color:#fff;
}
    .item{
    display:flex;
    justify-content:space-between;
    padding:10px;
    margin:5px 0;
    border-radius:10px;
    background: rgba(255,255,255,0.05);
    font-family: monospace;
}

/* HEADER */
header{
    padding:20px;
    text-align:center;
    font-size:20px;
    font-weight:700;
    letter-spacing:1px;
}

/* CARD TOTAL */
.card{
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    margin:15px;
    padding:15px;
    border-radius:16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* NAV */
nav{
    display:flex;
    justify-content:space-around;
    margin:10px;
}

nav button{
    flex:1;
    margin:3px;
    padding:10px;
    border:none;
    border-radius:12px;
    background: rgba(255,255,255,0.08);
    color:#fff;
    font-weight:600;
}

/* ACTIVE BUTTON */
nav button:hover{
    background:#2563eb;
}

/* PAGE */
.page{ display:none; }
.active{ display:block; }

/* INPUTS */
input, select{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    border:none;
    outline:none;
    background: rgba(255,255,255,0.08);
    color:#fff;
}

button.action{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-weight:600;
}

/* LIST */
.item{
    display:flex;
    justify-content:space-between;
    padding:10px;
    margin:5px 0;
    border-radius:10px;
    background: rgba(255,255,255,0.05);
}

/* COLORS */
.income{ color:#22c55e; }
.expense{ color:#ef4444; }
.saving{ color:#fbbf24; }

.small{
    opacity:0.7;
    font-size:12px;
}
</style>
</head>

<body>

<header>💳 Neo Finance Bank</header>

<!-- TOTAL -->
<div class="card">
    <h3>📊 Баланс</h3>
    <div id="totalView"></div>
</div>

<!-- NAV -->
<nav>
    <button onclick="showPage('income')">Доход</button>
    <button onclick="showPage('expense')">Расход</button>
    <button onclick="showPage('saving')">Сбережения</button>
</nav>

<!-- FILTER -->
<div class="card">
    <h4>📅 Фильтр</h4>
    <select id="filterType" onchange="render()">
        <option value="all">Все</option>
        <option value="day">День</option>
        <option value="month">Месяц</option>
        <option value="year">Год</option>
    </select>
    <input type="date" id="filterDate" onchange="render()">
</div>

<!-- INCOME -->
<div id="income" class="page active card">
    <h3 class="income">💵 Доходы</h3>
    <input id="incomeName" placeholder="Источник">
    <input id="incomeDate" type="date">
    <input id="incomeAmount" type="number" placeholder="Сумма">
    <button class="action" onclick="add('income')">Добавить доход</button>
    <div id="incomeList"></div>
</div>

<!-- EXPENSE -->
<div id="expense" class="page card">
    <h3 class="expense">💸 Расходы</h3>
    <input id="expenseName" placeholder="Категория">
    <input id="expenseDate" type="date">
    <input id="expenseAmount" type="number" placeholder="Сумма">
    <button class="action" onclick="add('expense')">Добавить расход</button>
    <div id="expenseList"></div>
</div>

<!-- SAVING -->
<div id="saving" class="page card">
    <h3 class="saving">🏦 Накопления</h3>
    <input id="savingName" placeholder="Цель">
    <input id="savingDate" type="date">
    <input id="savingAmount" type="number" placeholder="Сумма">
    <button class="action" onclick="add('saving')">Добавить</button>
    <div id="savingList"></div>
</div>

<script>
// Firebase config
const firebaseConfig = {
    apiKey: "AIzaSyCbWcqsGVkAAPNP66ZvNkPB-ujme4VxYDw",
    authDomain: "finance-app-c84f5.firebaseapp.com",
    databaseURL: "https://finance-app-c84f5-default-rtdb.firebaseio.com",
    projectId: "finance-app-c84f5",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = { income:[], expense:[], saving:[] };

function loadData(){
    let loaded = 0;

    ["income","expense","saving"].forEach(type=>{
        db.ref(type).on("value", snap=>{
            let val = snap.val();

            data[type] = val
                ? Object.entries(val).map(([id, item]) => ({
                    id,
                    ...item
                }))
                : [];

            loaded++;

            if(loaded === 3){
                render(); // 🔥 один общий рендер
            }
        });
    });
}

function add(type){
    let name = document.getElementById(type + "Name").value;
    let date = document.getElementById(type + "Date").value;
    let amount = parseFloat(document.getElementById(type + "Amount").value);

    if(!name || !date || isNaN(amount)) return;

    db.ref(type).push({
        name,
        date,
        amount
    });

    // очистка полей
    document.getElementById(type + "Name").value = "";
    document.getElementById(type + "Date").value = "";
    document.getElementById(type + "Amount").value = "";
}
function matchDate(dateStr){
    let filter = document.getElementById("filterType").value;
    let filterDate = document.getElementById("filterDate").value;

    if(filter === "all" || !filterDate) return true;

    let d = new Date(dateStr);
    let f = new Date(filterDate);

    if(filter === "day"){
        return d.toDateString() === f.toDateString();
    }

    if(filter === "month"){
        return d.getMonth() === f.getMonth() &&
               d.getFullYear() === f.getFullYear();
    }

    if(filter === "year"){
        return d.getFullYear() === f.getFullYear();
    }

    return true;
}

function renderList(type){
    let list = document.getElementById(type+"List");
    list.innerHTML = "";

    let filtered = data[type]
        .filter(e => matchDate(e.date))
        .sort((a,b) => new Date(b.date) - new Date(a.date));

    filtered.forEach(e=>{
        let div = document.createElement("div");
        div.className = "item";

        div.innerHTML = `
            <div>
                <div>${e.name}</div>
                <div style="font-size:12px;opacity:0.7">${e.date}</div>
            </div>

            <div style="display:flex;gap:8px;align-items:center">
                <div>${e.amount}</div>

                <button onclick="editItem('${type}','${e.id}')"
                    style="background:#3b82f6;color:#fff;border:none;border-radius:6px;padding:4px 6px;">
                    ✏️
                </button>

                <button onclick="removeItem('${type}','${e.id}')"
                    style="background:#ef4444;color:#fff;border:none;border-radius:6px;padding:4px 6px;">
                    🗑️
                </button>
            </div>
        `;

        list.appendChild(div);
    });
}

function getTotal(type){
    return data[type].reduce((s,e)=>s+e.amount,0);
}
function removeItem(type, id){
    db.ref(type).child(id).remove();
}
function editItem(type, id){
    let item = data[type].find(e => e.id === id);

    let name = prompt("Название", item.name);
    let date = prompt("Дата", item.date);
    let amount = prompt("Сумма", item.amount);

    if(!name || !date || !amount) return;

    db.ref(type).child(id).update({
        name,
        date,
        amount: parseFloat(amount)
    });
}

function render(){

    renderList("income");
    renderList("expense");
    renderList("saving");

    let income = getTotal("income");
    let expense = getTotal("expense");
    let saving = getTotal("saving");

    let difference = income - expense;
    let total = difference + saving;

    document.getElementById("totalView").innerHTML = `
        <p>💵 Доходы: ${income}</p>
        <p>💸 Расходы: ${expense}</p>
        <p>📊 Разница: ${difference}</p>
        <p>🏦 Накопления: ${saving}</p>
        <hr>
        <p style="font-size:18px;font-weight:bold">
            💳 Итого: ${total}
        </p>
    `;
}

function showPage(page){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(page).classList.add("active");
}

loadData();
render();
</script>

</body>
</html>
