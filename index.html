<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Учёт расходов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 20px auto;
            padding: 10px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            font-size: 16px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }

        .total {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<h2>💸 Учёт расходов</h2>

<input type="text" id="name" placeholder="Название расхода">
<input type="date" id="date">
<input type="number" id="amount" placeholder="Сумма">

<button onclick="addExpense()">Добавить</button>

<h3>Список</h3>
<div id="list"></div>

<div class="total" id="total">Итого: 0</div>

<script>
    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    function save() {
        localStorage.setItem("expenses", JSON.stringify(expenses));
    }

    function addExpense() {
        const name = document.getElementById("name").value;
        const date = document.getElementById("date").value;
        const amount = parseFloat(document.getElementById("amount").value);

        if (!name || !date || !amount) return;

        expenses.push({ name, date, amount });

        save();
        render();

        document.getElementById("name").value = "";
        document.getElementById("date").value = "";
        document.getElementById("amount").value = "";
    }

    function render() {
        const list = document.getElementById("list");
        list.innerHTML = "";

        let total = 0;

        expenses.forEach((e, index) => {
            total += e.amount;

            const div = document.createElement("div");
            div.className = "item";

            div.innerHTML = `
                <span>${e.date} | ${e.name}</span>
                <span>${e.amount.toFixed(2)} €</span>
                <button onclick="removeExpense(${index})">❌</button>
            `;

            list.appendChild(div);
        });

        document.getElementById("total").innerText = "Итого: " + total.toFixed(2) + " €";
    }

    function removeExpense(index) {
        expenses.splice(index, 1);
        save();
        render();
    }

    render();
</script>

</body>
</html>
