<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Bank UI</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

body{
    margin:0;
    font-family:'Inter', sans-serif;
    background: linear-gradient(135deg,#0f172a,#111827);
    color:#fff;
}

/* HEADER */
header{
    padding:20px;
    text-align:center;
    font-size:20px;
    font-weight:700;
    letter-spacing:1px;
}

/* CARD TOTAL */
.card{
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    margin:15px;
    padding:15px;
    border-radius:16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

/* NAV */
nav{
    display:flex;
    justify-content:space-around;
    margin:10px;
}

nav button{
    flex:1;
    margin:3px;
    padding:10px;
    border:none;
    border-radius:12px;
    background: rgba(255,255,255,0.08);
    color:#fff;
    font-weight:600;
}

/* ACTIVE BUTTON */
nav button:hover{
    background:#2563eb;
}

/* PAGE */
.page{ display:none; }
.active{ display:block; }

/* INPUTS */
input, select{
    width:100%;
    padding:12px;
    margin:6px 0;
    border-radius:12px;
    border:none;
    outline:none;
    background: rgba(255,255,255,0.08);
    color:#fff;
}

button.action{
    width:100%;
    padding:12px;
    margin-top:8px;
    border:none;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    font-weight:600;
}

/* LIST */
.item{
    display:flex;
    justify-content:space-between;
    padding:10px;
    margin:5px 0;
    border-radius:10px;
    background: rgba(255,255,255,0.05);
}

/* COLORS */
.income{ color:#22c55e; }
.expense{ color:#ef4444; }
.saving{ color:#fbbf24; }

.small{
    opacity:0.7;
    font-size:12px;
}
</style>
</head>

<body>

<header>💳 Neo Finance Bank</header>

<!-- TOTAL -->
<div class="card">
    <h3>📊 Баланс</h3>
    <div id="totalView"></div>
</div>

<!-- NAV -->
<nav>
    <button onclick="showPage('income')">Доход</button>
    <button onclick="showPage('expense')">Расход</button>
    <button onclick="showPage('saving')">Сбережения</button>
</nav>

<!-- FILTER -->
<div class="card">
    <h4>📅 Фильтр</h4>
    <select id="filterType" onchange="render()">
        <option value="all">Все</option>
        <option value="day">День</option>
        <option value="month">Месяц</option>
        <option value="year">Год</option>
    </select>
    <input type="date" id="filterDate" onchange="render()">
</div>

<!-- INCOME -->
<div id="income" class="page active card">
    <h3 class="income">💵 Доходы</h3>
    <input id="incomeName" placeholder="Источник">
    <input id="incomeDate" type="date">
    <input id="incomeAmount" type="number" placeholder="Сумма">
    <button class="action" onclick="add('income')">Добавить доход</button>
    <div id="incomeList"></div>
</div>

<!-- EXPENSE -->
<div id="expense" class="page card">
    <h3 class="expense">💸 Расходы</h3>
    <input id="expenseName" placeholder="Категория">
    <input id="expenseDate" type="date">
    <input id="expenseAmount" type="number" placeholder="Сумма">
    <button class="action" onclick="add('expense')">Добавить расход</button>
    <div id="expenseList"></div>
</div>

<!-- SAVING -->
<div id="saving" class="page card">
    <h3 class="saving">🏦 Накопления</h3>
    <input id="savingName" placeholder="Цель">
    <input id="savingDate" type="date">
    <input id="savingAmount" type="number" placeholder="Сумма">
    <button class="action" onclick="add('saving')">Добавить</button>
    <div id="savingList"></div>
</div>

<script>
// Firebase config
const firebaseConfig = {
    apiKey: "YOUR_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT.firebaseio.com",
    projectId: "YOUR_PROJECT",
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let data = { income:[], expense:[], saving:[] };

function loadData(){
    ["income","expense","saving"].forEach(type=>{
        db.ref(type).on("value", snap=>{
            data[type] = snap.val() || [];
            render();
        });
    });
}

function save(type){
    db.ref(type).set(data[type]);
}

function add(type){
    let name=document.getElementById(type+"Name").value;
    let date=document.getElementById(type+"Date").value;
    let amount=parseFloat(document.getElementById(type+"Amount").value);

    if(!name || !date || isNaN(amount)) return;

    data[type].push({name,date,amount});
    save(type);
    render();
}

function matchDate(dateStr){
    let filter=document.getElementById("filterType").value;
    let filterDate=document.getElementById("filterDate").value;

    if(filter==="all"||!filterDate) return true;

    let d=new Date(dateStr);
    let f=new Date(filterDate);

    if(filter==="day") return d.toDateString()===f.toDateString();

    if(filter==="month")
        return d.getMonth()===f.getMonth() && d.getFullYear()===f.getFullYear();

    if(filter==="year")
        return d.getFullYear()===f.getFullYear();

    return true;
}

function renderList(type){
    let list=document.getElementById(type+"List");
    list.innerHTML="";

    data[type]
    .filter(e=>matchDate(e.date))
    .forEach(e=>{
        let div=document.createElement("div");
        div.className="item";

        div.innerHTML=`
            <div>
                <div>${e.name}</div>
                <div class="small">${e.date}</div>
            </div>
            <div class="${type}">${e.amount}</div>
        `;
        list.appendChild(div);
    });
}

function getTotal(type){
    return data[type].reduce((s,e)=>s+e.amount,0);
}

function render(){
    renderList("income");
    renderList("expense");
    renderList("saving");

    document.getElementById("totalView").innerHTML=`
        <p class="income">Доход: ${getTotal("income")}</p>
        <p class="expense">Расход: ${getTotal("expense")}</p>
        <p class="saving">Накопления: ${getTotal("saving")}</p>
    `;
}

function showPage(page){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(page).classList.add("active");
}

loadData();
render();
</script>

</body>
</html>
